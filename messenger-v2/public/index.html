<!DOCTYPE html>
<html>

<head>

<title>Messenger V2</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="auth">

<h1>💬 Messenger V2</h1>

<input
id="username"
placeholder="Username"
>

<input
id="password"
type="password"
placeholder="Password"
>

<input
type="file"
id="avatar"
>

<button id="registerBtn">
REGISTER
</button>

<button id="loginBtn">
LOGIN
</button>

</div>

<div id="app" style="display:none;">

<div id="sidebar">

<h2 id="me"></h2>

<input
id="search"
placeholder="Find friends..."
>

<div id="users"></div>

</div>

<div id="chatSection">

<div id="chatTop">
Select chat
</div>

<div id="chat"></div>

<div id="bottom">

<input
id="messageInput"
placeholder="Message..."
>

<button id="sendBtn">
SEND
</button>

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="app.js"></script>

</body>
</html>
