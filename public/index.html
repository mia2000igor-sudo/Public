<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Messenger V4</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="auth">

<h1>💬 Messenger V4</h1>

<input
id="username"
placeholder="Username"
>

<input
id="password"
type="password"
placeholder="Password"
>

<input
type="file"
id="avatar"
>

<button id="registerBtn">
REGISTER
</button>

<button id="loginBtn">
LOGIN
</button>

</div>

<div id="app">

<div id="sidebar">

<h2 id="me"></h2>

<div class="tabs">

<button onclick="showTab('friends')">
Friends
</button>

<button onclick="showTab('search')">
Search
</button>

<button onclick="showTab('requests')">
Requests
</button>

</div>

<div id="friendsTab"></div>

<div id="searchTab">

<input
id="searchInput"
placeholder="Find users..."
>

<div id="searchResults"></div>

</div>

<div id="requestsTab"></div>

</div>

<div id="chatSection">

<div id="chatTop">

Select friend

</div>

<div id="chat"></div>

<div id="bottom">

<input
id="messageInput"
placeholder="Message..."
>

<button id="sendBtn">
SEND
</button>

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="app.js"></script>

</body>
</html>
