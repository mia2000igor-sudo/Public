<!DOCTYPE html>
<html>
<head>

<title>Messenger</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="auth">

<h1>💬 MY MESSENGER</h1>

<input
id="username"
placeholder="Username"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="loginBtn">
LOGIN
</button>

<button id="registerBtn">
REGISTER
</button>

</div>

<div id="app" style="display:none;">

<div id="top">

<span id="me"></span>

<button id="logoutBtn">
EXIT
</button>

</div>

<div id="chat"></div>

<div id="bottom">

<input
id="msg"
placeholder="Message..."
>

<button id="sendBtn">
SEND
</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="app.js"></script>

</body>
</html>
