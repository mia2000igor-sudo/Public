<!DOCTYPE html>
<html>
<head>
<title>Messenger</title>

<style>

body{
background:#0f0f0f;
color:white;
font-family:Arial;
margin:0;
}

#top{
background:#1f1f1f;
padding:15px;
font-size:22px;
text-align:center;
}

#chat{
height:70vh;
overflow-y:auto;
padding:10px;
}

.message{
background:#222;
padding:10px;
margin:10px;
border-radius:10px;
}

input{
padding:15px;
font-size:18px;
border:none;
outline:none;
}

#bottom{
display:flex;
position:fixed;
bottom:0;
width:100%;
}

#msg{
flex:1;
}

button{
padding:15px;
background:#5865f2;
color:white;
border:none;
font-size:18px;
}

</style>
</head>

<body>

<div id="top">
💬 MY MESSENGER
</div>

<div id="chat"></div>

<div id="bottom">

<input id="msg"
placeholder="message">

<button onclick="sendMessage()">
SEND
</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const username =
prompt("Your name?");

const chat =
document.getElementById("chat");

socket.emit("join", username);

function sendMessage(){

const input =
document.getElementById("msg");

socket.emit("message", {
user:username,
text:input.value
});

input.value = "";

}

socket.on("message", data=>{

chat.innerHTML += `
<div class="message">
<b>${data.user}</b><br>
${data.text}
</div>
`;

chat.scrollTop =
chat.scrollHeight;

});

</script>

</body>
</html>
