<!DOCTYPE html>
<html>
<head>
<title>Stream</title>
<style>
body{
background:black;
color:white;
text-align:center;
font-family:Arial;
}
video{
width:90%;
margin-top:20px;
}
button{
padding:15px;
font-size:20px;
}
</style>
</head>
<body>

<h1>🎥 LIVE STREAM</h1>

<button onclick="start()">START CAMERA</button>

<br>

<video id="video" autoplay playsinline></video>

<script>
async function start(){

const stream =
await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

document.getElementById("video").srcObject = stream;

}
</script>

</body>
</html>
